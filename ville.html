<!doctype html>
<html lang="fr" data-da="pop">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Que faire ? · Vols directs depuis Lyon</title>
  <meta name="description" content="Les incontournables de la ville : prix, réservation à l'avance, meilleur moment, et le vol direct depuis Lyon.">
  <meta name="theme-color" content="#14213d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2314213d'/><path d='M8 18l4 1 5-7 2 1-3 7 5 1 2-2 1 1-2 3-3 1-11-3z' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="ville.css">
</head>
<body>
  <a class="back" href="index.html" aria-label="Retour aux vols">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg> Vols
  </a>

  <header class="v-hero" id="v-hero">
    <div class="v-hero-text">
      <p class="v-country" id="v-country"></p>
      <h1 id="v-city">Chargement…</h1>
    </div>
  </header>

  <main class="v-main">
    <p class="v-pitch" id="v-pitch"></p>

    <a class="v-flight" id="v-flight" href="index.html" hidden></a>

    <button type="button" class="v-custom" disabled>
      <span>Préparer mon séjour sur mesure</span>
      <span class="v-soon">Bientôt</span>
    </button>

    <section aria-labelledby="t-acts">
      <h2 class="v-h2" id="t-acts">Les incontournables</h2>
      <div class="v-chips" id="v-chips" role="group" aria-label="Filtrer les activités"></div>
      <ul class="v-list" id="v-list"></ul>
    </section>

    <section aria-labelledby="t-map">
      <h2 class="v-h2" id="t-map">Sur la carte</h2>
      <div class="v-map" id="v-map"></div>
      <p class="v-map-note">Touchez un point pour voir l'activité.</p>
    </section>

    <p class="v-foot" id="v-foot"></p>
  </main>

  <!-- Fiche d'une activité -->
  <dialog class="v-sheet" id="v-sheet" aria-labelledby="a-title"></dialog>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="ville.js"></script>
</body>
</html>
