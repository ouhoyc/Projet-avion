# Met à jour matchs/CODE.json (foot, basket, rugby dans chaque destination) deux fois par semaine.
# Source gratuite, sans clé : SofaScore. Lancement à la main seulement (« Run workflow ») :
# SofaScore refuse les serveurs de GitHub (erreur 403, oct. 2026), donc pas de lancement automatique
# pour ne pas recevoir un e-mail d'échec deux fois par semaine. La mise à jour se fait depuis une
# session Claude : `node scripts/fetch-matchs.mjs`, puis commit de matchs/ et matchs-cache.json.
name: Mise à jour des matchs

on:
  workflow_dispatch:

permissions:
  contents: write           # nécessaire pour committer matchs.json

concurrency:
  group: update-matchs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Récupérer les matchs
        run: node scripts/fetch-matchs.mjs
        env:
          # Si SofaScore bloque les serveurs de GitHub, on passe par le proxy Apify (même clé que l'Action « Tendances »).
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

      - name: Committer les données si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matchs matchs-cache.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour des matchs ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
