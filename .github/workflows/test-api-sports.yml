# TEMPORAIRE : vérifie ce que l'offre gratuite d'API-Sports donne (saison en cours ?). À supprimer après.
name: Test API-Sports

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Tester
        env:
          KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "Secret API_SPORTS_KEY absent"; exit 1; }
          J7=$(date -u -d '+7 days' +%F); J60=$(date -u -d '+60 days' +%F); J150=$(date -u -d '+150 days' +%F)
          q() { curl -s -m 30 -H "x-apisports-key: $KEY" "$1" > r.json; python3 - "$1" <<'PY'
          import json,sys
          d=json.load(open('r.json')); r=d.get('response')
          n=len(r) if isinstance(r,list) else r
          ex=''
          if isinstance(r,list) and r:
              x=r[0]; ex=json.dumps(x)[:400]
          print(sys.argv[1].split('.io')[1], '| erreurs:', d.get('errors'), '| resultats:', d.get('results'), '\n   ', ex if isinstance(r,list) else json.dumps(n)[:600])
          PY
          }
          q "https://v3.football.api-sports.io/status"
          q "https://v3.football.api-sports.io/fixtures?date=$J7"
          q "https://v3.football.api-sports.io/fixtures?date=$J150"
          q "https://v3.football.api-sports.io/fixtures?league=106&season=2026&next=5"
          q "https://v1.basketball.api-sports.io/games?date=$J7"
          q "https://v1.rugby.api-sports.io/games?date=$J60"
