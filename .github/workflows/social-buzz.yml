# Lancé à la main : collecte ce que disent TikTok, Instagram, YouTube et Reddit sur une ville
# (restaurants et activités en un seul lancement, ~0,75 $ par ville). Le résultat est une pièce jointe de l'Action, gardée 7 jours,
# jamais publiée sur le site. Coût : prélevé sur le crédit Apify (plafonds dans le script).
name: Tendances réseaux sociaux

on:
  workflow_dispatch:
    inputs:
      ville_en:
        description: 'Nom de la ville en anglais'
        default: 'Warsaw'
      ville_fr:
        description: 'Nom de la ville en français'
        default: 'Varsovie'
      requetes_locales:
        description: 'Recherches TikTok dans la langue locale (4 au plus : 2 restos, 2 activités), séparées par ;'
        default: 'gdzie zjeść Warszawa;najlepsze restauracje Warszawa;co robić w Warszawie;Warszawa atrakcje'
      hashtags:
        description: 'Hashtags Instagram sans # (2 au plus : 1 food, 1 voyage), séparés par ;'
        default: 'warsawfood;visitwarsaw'
      reseaux:
        description: 'Réseaux à interroger (tiktok;instagram;youtube;reddit), vide = tous'
        default: ''

permissions:
  contents: read

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Collecter
        run: node scripts/social-buzz.mjs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          VILLE_EN: ${{ inputs.ville_en }}
          VILLE_FR: ${{ inputs.ville_fr }}
          REQUETES_LOCALES: ${{ inputs.requetes_locales }}
          HASHTAGS: ${{ inputs.hashtags }}
          RESEAUX: ${{ inputs.reseaux }}
      - uses: actions/upload-artifact@v4
        with:
          name: buzz-${{ inputs.ville_en }}
          path: buzz/
          retention-days: 7
